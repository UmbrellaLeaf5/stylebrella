[workspace]

[package]
name = "install-engines"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
